# Publishes the My Sweetart storefront to GitHub Pages on every push to main, so there is always a public
# preview at https://adenpolak.github.io/Moran-Website/ even before (or beside) the Vercel deployment.
# Pages is static only: /api/* does not exist there, so checkout shows its "Preview mode" notice instead of Stripe.
name: Preview on GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site files
        run: |
          mkdir -p _site/lib _site/images
          cp index.html admin.html catalog.json favicon.svg apple-touch-icon.png _site/
          cp lib/pricing.js _site/lib/
          cp -r images/. _site/images/ 2>/dev/null || true
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt   # a preview, not the shop; keep it out of search
          ls -R _site | head -40
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
